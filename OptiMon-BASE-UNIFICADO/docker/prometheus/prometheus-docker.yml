global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'  # Nombre del servicio Docker

scrape_configs:
  # Prometheus mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - dentro de Docker
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node_exporter:9100']  # Nombre del servicio Docker
        labels:
          instance: 'local-server'
          job: 'node'

  # cAdvisor - monitoreo de contenedores
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']  # Puerto interno de cAdvisor
        labels:
          instance: 'local-docker'
          job: 'containers'

  # Portal Web OptiMon - acceso desde host
  - job_name: 'optimon-portal'
    static_configs:
      - targets: ['host.docker.internal:5000']  # Acceso al host desde Docker
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  # Windows Exporter local (si existe)
  - job_name: 'windows-local'
    static_configs:
      - targets: ['host.docker.internal:9182']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # Instancias Azure
  - job_name: "azure-instances"
    static_configs:
      - targets:
        - "172.191.59.230:9100"
        labels:
          provider: "azure"
          cloud: "azure"

  # Instancias AWS
  - job_name: "aws-instances"
    static_configs:
      - targets:
        - "54.242.7.97:9100"
        - "34.207.186.220:9100"
        - "34.230.21.233:9100"
        labels:
          provider: "aws"
          cloud: "aws"
